name: Weekly AI Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'  # UTC 08:00 Friday = 台灣 16:00 週五（收盤後，一週總結）

permissions:
  contents: write

concurrency:
  group: ai-analysis
  cancel-in-progress: true

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI stock analysis
        timeout-minutes: 50
        run: python stock_analyze.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pwa/analysis.json
          git diff --cached --quiet || git commit -m "analysis: weekly AI update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push || { sleep 30 && git push; }

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pwa --project-name=stock-viewer --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify via Telegram
        if: success()
        run: |
          curl -s -X POST https://pomodoro-bot.juria-orch.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "8786691885", "text": "🤖 AI 週分析已更新 ('"$(TZ=Asia/Taipei date +%Y-%m-%d %H:%M)"')"}'
