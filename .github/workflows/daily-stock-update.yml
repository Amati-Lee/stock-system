name: Daily Stock Update

on:
  # 手動觸發（手機 GitHub App 可用）
  workflow_dispatch:
  # 備援：CF Worker 15:30 為主力，GitHub cron 17:00 補跑（僅在 CF 觸發失敗時才會實際執行）
  schedule:
    - cron: '0 9 * * 1-5'  # UTC 09:00 = 台灣 17:00

permissions:
  contents: write

# 防止雙重觸發衝突（GitHub cron + Cloudflare Worker 同時跑）
concurrency:
  group: daily-stock-update
  cancel-in-progress: false  # 後到的排隊等，不直接取消（避免資料漏跑）

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if already deployed today (backup cron guard)
        id: check_already_ran
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          # 查詢今天是否已有成功的 run（不含自己）
          RUNS=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-stock-update.yml/runs?created=${TODAY}&status=success&per_page=5" \
            | jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          if [ "$RUNS" -gt 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ 今天已有成功的 run，備援 cron 跳過"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "⚠️ 今天尚無成功 run，備援 cron 開始執行"
          fi

      # ⚠️ checkout 必須排在假日判斷之前：休市日清單的唯一來源是 repo 裡的
      #    holidays.txt，沒有 checkout 就讀不到。（休市日多跑這一步約 20 秒）
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if Taiwan market is open today
        id: check_holiday
        run: |
          # 備援 cron 若偵測到今天已成功，直接跳過
          if [ "${{ steps.check_already_ran.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ 今天已有成功部署，跳過"
            exit 0
          fi

          # 休市日清單的唯一來源 = holidays.txt（run_daily.bat 讀的是同一份）。
          # ⛔ 不要在這裡再寫死第二份：2026-10 就是因為兩份不同步才漏判。
          #    格式 YYYY-MM-DD，# 開頭是註解，每年底更新下一年度。
          HOLIDAY_FILE="holidays.txt"
          if [ ! -f "$HOLIDAY_FILE" ]; then
            echo "::error::找不到 $HOLIDAY_FILE，無法判斷今天是否休市"
            exit 1
          fi

          # 先把檔案解析成乾淨的日期清單（去掉 CR、註解、空行）
          DATES=$(tr -d '\r' < "$HOLIDAY_FILE" \
                  | sed 's/#.*//' \
                  | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' )
          N=$(echo "$DATES" | grep -c . || true)

          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          DOW=$(TZ=Asia/Taipei date +%u)  # 1=Mon ... 7=Sun
          YEAR=${TODAY%%-*}
          N_YEAR=$(echo "$DATES" | grep -c "^${YEAR}-" || true)
          echo "today=$TODAY (weekday=$DOW)"
          echo "holidays.txt 解析到 $N 個休市日，其中 $YEAR 年有 $N_YEAR 個"

          # 解析不出東西 = 清單格式壞了。這種閘門永遠通過比沒有更糟，直接失敗。
          if [ "$N" -lt 10 ]; then
            echo "::error::holidays.txt 只解析到 $N 個日期，格式可能壞了，不敢判斷"
            exit 1
          fi
          # 今年一個都沒有 = 跨年了沒更新。這裡刻意「放行」而不是失敗：
          # 擋下來會整條停擺，而大戶持股之類的資料漏掉就補不回來；
          # 假交易日則是事後刪得掉的。但要叫得夠大聲。
          if [ "$N_YEAR" -eq 0 ]; then
            echo "::warning::holidays.txt 沒有任何 $YEAR 年的休市日，請更新（今天先當交易日處理）"
          fi

          if [ "$DOW" -ge 6 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⛔ $TODAY 是週末，跳過"
          elif echo "$DATES" | grep -qxF "$TODAY"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⛔ $TODAY 在 holidays.txt 裡（休市），跳過"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ $TODAY 是交易日"
          fi

      - name: Setup Python
        if: steps.check_holiday.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_holiday.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Restore OHLC cache
        if: steps.check_holiday.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            pwa/ohlc
            pwa/ohlc_backup
          key: ohlc-data-${{ github.run_id }}
          restore-keys: ohlc-data-

      - name: Download stock data
        id: download
        if: steps.check_holiday.outputs.skip != 'true'
        run: |
          # ⭐ 先記下「下載前手上最新的交易日」。freshness 閘門比的是這個數字有沒有
          #    往前走。這一行必須在 python 之前，否則 python 失敗時整步中斷就記不到。
          BEFORE=$(ls stock_data_*.csv 2>/dev/null | sed 's/.*stock_data_//;s/\.csv$//' | sort | tail -1)
          echo "before=${BEFORE:-none}" >> $GITHUB_OUTPUT
          echo "下載前最新交易日：${BEFORE:-（一份都沒有）}"
          python stock_system.py
        continue-on-error: true

      # ⛔⛔ 判準是「最新交易日有沒有往前走」，不是「今天日期的 CSV 在不在」。
      #     stock_system.py 的檔名取自資料自己的「交易日」欄位（_save_stock_csv），
      #     所以臨時休市那天抓到的是昨天的資料、檔名也是昨天，而且因為檔案已存在
      #     還會「跳過覆蓋」然後正常退出 0 ——
      #     舊版只在 download 失敗時才檢查 CSV，於是 2026-10-23 颱風假整條照跑，
      #     把 10/22 的收盤蓋上 10/23 的日期發布出去。
      #     用「有沒有更新的交易日」同時解決三件事：
      #       休市日擋得住 / 盤中搶跑擋得住 / 同一天重跑不會再覆蓋一次當天結果，
      #     而「上一次跑到一半死掉」仍然補得起來（CSV 沒 commit，BEFORE 還是舊的）。
      - name: Check data freshness
        id: freshness
        if: steps.check_holiday.outputs.skip != 'true'
        run: |
          BEFORE="${{ steps.download.outputs.before }}"
          AFTER=$(ls stock_data_*.csv 2>/dev/null | sed 's/.*stock_data_//;s/\.csv$//' | sort | tail -1)
          AFTER=${AFTER:-none}
          echo "下載步驟結果：${{ steps.download.outcome }}"
          echo "最新交易日：${BEFORE:-none} → ${AFTER}"

          if [ "$AFTER" = "none" ] || [ "$AFTER" = "$BEFORE" ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
            echo "last=${BEFORE:-none}" >> $GITHUB_OUTPUT
            echo "⛔ 沒有拿到比 ${BEFORE:-（無）} 更新的交易日，跳過後續所有步驟（不重建、不部署、不 commit）"
            echo "::warning::本次沒有新的交易日資料（停在 ${BEFORE:-none}），可能是臨時休市、盤後資料還沒出、或下載失敗"
          else
            echo "stale=false" >> $GITHUB_OUTPUT
            echo "✅ 拿到新的交易日 ${AFTER}"
          fi

      - name: Build OHLC from CSVs
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python download_ohlc.py

      - name: Download institutional data
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python download_institutional.py

      # 融資融券：回測用的另一條資料軸（法人＝主力，融資＝散戶槓桿）。
      # ⭐ 刻意跑 --days 5 而不是只抓當天：已存在的日期會直接跳過、不發請求，
      #    所以成本幾乎是零，但**任何一天漏掉都會在接下來 5 天內自己補回來**。
      #    （法人資料就是因為漏掉的那天沒有人再回頭看，才破了 65 個洞）
      # ⚠️ 必須排在 download_ohlc.py 之後：它要讀 pwa/ohlc 取交易日曆。
      - name: Download margin trading balance
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        continue-on-error: true
        run: python download_margin.py --days 5

      # 大戶持股（集保股權分散表）：週資料，每週五一期。
      # ⭐ 每天跑而不是排在星期幾：TDCC 的發布時差不確定（週五的資料不知道
      #    週一還是週三才出），猜錯就漏一整週。這支只有「冒出新一期」才寫檔，
      #    重複跑會自己跳過，所以每天問一次最安全，成本是一個請求。
      # ⛔ 沒有回補功能：TDCC OpenData 的 scaDate 參數完全無效（一律回最新一期，
      #    而且 HTTP 200、格式正確、看起來成功），歷史只能單支查 ⇒ 不可能補。
      - name: Download shareholder distribution (大戶持股)
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        continue-on-error: true
        run: python download_holders.py

      - name: Download PE river data
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python download_pe.py

      - name: Download conference dates
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python download_conference.py

      - name: Download industry classification
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python download_industry.py

      - name: Download global indicators (VIX, SOX, DXY)
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        continue-on-error: true
        run: python download_global.py

      - name: Run stock alerts
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python stock_alert.py

      - name: Scan candidates (Hurst + retention + limit-up + vol)
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python scan_candidates.py

      # 預先登記的每日記錄。規則凍結於 PREREGISTRATION.md（2026-09-24）。
      # ⛔ 只記錄「今天有哪些股票符合哪個假設」，**不計算任何報酬**。
      #    開盲前算報酬 ＝ 偷看 ＝ 該次驗證作廢。
      # ⚠️ 必須排在 OHLC／融資／大戶三個下載之後。
      - name: Record pre-registered signals
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        continue-on-error: true
        run: python prereg_record.py

      - name: AI stock analysis
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python stock_analyze.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check watchlist conditions
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python watchlist_check.py

      - name: Generate PWA
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: python generate_pwa.py

      - name: Commit new data
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data_*.csv stock_names_all.json stock_industry.json tw_stock_verified.txt watchlist.json ohlc_snapshot.tar.gz
          git add -f pwa/alerts.json pwa/analysis.json pwa/institutional.json pwa/watchlist_status.json pwa/pe_river.json pwa/conferences.json pwa/index.html pwa/sw.js
          git add -f pe_history.json
          git add alerts_history/
          git add candidates_history/
          git add margin_history/
          git add holders_history/
          git add prereg_log/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) stock update"
          git stash --include-untracked 2>/dev/null || true
          git pull --rebase -X theirs || {
            echo "Rebase failed, aborting and retrying with merge..."
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase -X ours
          }
          git stash pop 2>/dev/null || true
          git push || { sleep 30 && git push; }

      - name: Deploy to Cloudflare Pages
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true'
        run: |
          rm -rf pwa/ohlc_backup
          npx wrangler pages deploy pwa --project-name=stock-viewer --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify via Telegram
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale != 'true' && success()
        run: |
          curl -s -X POST https://pomodoro-bot.juria-orch.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"broadcast": true, "text": "📊 Stock PWA 已更新部署完成 ('"$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"')"}'

      # 已知的國定假日在 check_holiday 就擋掉了，不會走到這裡。
      # 會走到這裡的是：臨時休市（颱風假）、盤後資料還沒出就手動跑、下載失敗。
      # ⭐ 這三種都是「該讓他知道」的，不是雜訊 —— 2026-10-23 那次就是沒人收到通知。
      - name: Notify stale data
        if: steps.check_holiday.outputs.skip != 'true' && steps.freshness.outputs.stale == 'true'
        run: |
          LAST="${{ steps.freshness.outputs.last }}"
          curl -s -X POST https://pomodoro-bot.juria-orch.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"broadcast": true, "text": "⚠️ Stock 今日未部署：沒有拿到新的交易日資料，停在 '"${LAST}"'。可能是臨時休市、盤後資料還沒出、或下載失敗 ('"$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"')"}'
