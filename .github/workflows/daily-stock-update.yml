name: Daily Stock Update

on:
  # 手動觸發（手機 GitHub App 可用）
  workflow_dispatch:

  # 每個交易日台灣時間 15:30 (UTC 07:30)
  schedule:
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download stock data
        run: python stock_system.py

      - name: Generate PWA
        run: python generate_pwa.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data_*.csv breakout_signals_*.json stock_names_all.json tw_stock_verified.txt watchlist.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) stock update"
          git push

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pwa --project-name=stock-viewer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
