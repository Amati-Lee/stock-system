name: Daily Stock Update

on:
  # 手動觸發（手機 GitHub App 可用）
  workflow_dispatch:
  # 雙重保險：GitHub cron + Cloudflare Worker 同時排程，先到先跑，重複跑也安全
  schedule:
    - cron: '30 7 * * 1-5'  # UTC 07:30 = 台灣 15:30

permissions:
  contents: write

# 防止雙重觸發衝突（GitHub cron + Cloudflare Worker 同時跑）
concurrency:
  group: daily-stock-update
  cancel-in-progress: false  # 後到的排隊等，不直接取消（避免資料漏跑）

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check if Taiwan market is open today
        id: check_holiday
        run: |
          # 台灣國定假日（每年底更新下一年）
          TW_HOLIDAYS_2026="
          2026-01-01
          2026-02-16
          2026-02-17
          2026-02-18
          2026-02-19
          2026-02-20
          2026-02-27
          2026-04-03
          2026-04-06
          2026-05-01
          2026-06-19
          2026-09-25
          2026-09-28
          2026-10-09
          2026-10-26
          2026-12-25
          "
          # 2026 補班日（週六上班，但這裡不需要處理，因為 cron 只跑週一到五）

          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          DOW=$(TZ=Asia/Taipei date +%u)  # 1=Mon ... 7=Sun
          echo "today=$TODAY (weekday=$DOW)"

          if [ "$DOW" -ge 6 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⛔ $TODAY 是週末，跳過"
          elif echo "$TW_HOLIDAYS_2026" | grep -q "$TODAY"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⛔ $TODAY 是國定假日，跳過"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ $TODAY 是交易日"
          fi

      - name: Checkout repo
        if: steps.check_holiday.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.check_holiday.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_holiday.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Restore OHLC cache
        if: steps.check_holiday.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            pwa/ohlc
            pwa/ohlc_backup
          key: ohlc-data-${{ github.run_id }}
          restore-keys: ohlc-data-

      - name: Download stock data
        if: steps.check_holiday.outputs.skip != 'true'
        run: python stock_system.py

      - name: Build OHLC from CSVs
        if: steps.check_holiday.outputs.skip != 'true'
        run: python download_ohlc.py

      - name: Download institutional data
        if: steps.check_holiday.outputs.skip != 'true'
        run: python download_institutional.py

      - name: Download PE river data
        if: steps.check_holiday.outputs.skip != 'true'
        run: python download_pe.py

      - name: Download conference dates
        if: steps.check_holiday.outputs.skip != 'true'
        run: python download_conference.py

      - name: Run stock alerts
        if: steps.check_holiday.outputs.skip != 'true'
        run: python stock_alert.py

      - name: AI stock analysis
        if: steps.check_holiday.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python stock_analyze.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check watchlist conditions
        if: steps.check_holiday.outputs.skip != 'true'
        run: python watchlist_check.py

      - name: Generate PWA
        if: steps.check_holiday.outputs.skip != 'true'
        run: python generate_pwa.py

      - name: Commit new data
        if: steps.check_holiday.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data_*.csv stock_names_all.json tw_stock_verified.txt watchlist.json ohlc_snapshot.tar.gz
          git add -f pwa/alerts.json pwa/analysis.json pwa/institutional.json pwa/watchlist_status.json pwa/pe_river.json pwa/conferences.json
          git add -f pe_history.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) stock update"
          git stash --include-untracked 2>/dev/null || true
          git pull --rebase || {
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Rebase conflict (likely binary file), resolving with ours..."
              git checkout --ours ohlc_snapshot.tar.gz 2>/dev/null || true
              git add ohlc_snapshot.tar.gz
              GIT_EDITOR=true git rebase --continue
            else
              echo "Pull failed (network error?), retrying in 30s..."
              sleep 30
              git pull --rebase
            fi
          }
          git stash pop 2>/dev/null || true
          git push || { sleep 30 && git push; }

      - name: Deploy to Cloudflare Pages
        if: steps.check_holiday.outputs.skip != 'true'
        run: npx wrangler pages deploy pwa --project-name=stock-viewer --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify via Telegram
        if: steps.check_holiday.outputs.skip != 'true' && success()
        run: |
          curl -s -X POST https://pomodoro-bot.juria-orch.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "8786691885", "text": "📊 Stock PWA 已更新部署完成 ('"$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"')"}'
